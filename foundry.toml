[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/=lib/openzeppelin-contracts/contracts/", "@openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true

